<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="fw-bold h3 mb-1">Iniciar Sesión</h2>
              <p class="text-muted small">Ingresa con tu correo</p>
            </div>
            <form [formGroup]="formulario" (ngSubmit)="envio()">
              <div class="mb-3">
                <label for="usuario" class="form-label fw-semibold">Correo</label>
                <input type="text" id="usuario" class="form-control" placeholder="ejemplo@xbox.com"
                  formControlName="usuario" [class.is-invalid]="invalido('usuario')">
                @if (invalido('usuario')) {
                <div class="invalid-feedback">Ingrese su Correo...</div>
                }
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••"
                  formControlName="password" [class.is-invalid]="invalido('password')">
                @if (invalido('password')) {
                <div class="invalid-feedback">La contraseña es requerida (mínimo 6 caracteres)...</div>
                }
              </div>

                @if(error()){
                  <p class = "error">{{ error }}</p>
                }

              <button type="submit" [disabled] = "loading()">
                {{ loading() ? 'Ingresando..' : 'Ingresar'}}
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
